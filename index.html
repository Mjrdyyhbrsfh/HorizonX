<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Horizon X — Beyond the ordinary.">
  <title>Horizon X — Beyond the Ordinary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #050505;
      --panel: #101010;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --green: #8affaa;
      --red: #ff8585;
      --blue: #9cb5ff;
      --accent: #8affaa;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scrollbar-color: #444 #050505;
    }

    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body, button, input { font-family: inherit; }

    button, input { font-size: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 4px;
    }

    ::selection {
      color: #050505;
      background: var(--green);
    }

    .hidden { display: none !important; }

    /* =========================================
       ANIMATED BACKGROUND
    ========================================= */

    .fx-background {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 0%, #141a16 0%, #080808 45%, #050505 80%);
    }

    .fx-grid {
      position: absolute;
      inset: -50%;
      opacity: .18;
      background-image:
        linear-gradient(#8affaa18 1px, transparent 1px),
        linear-gradient(90deg, #8affaa18 1px, transparent 1px);
      background-size: 48px 48px;
      transform: perspective(500px) rotateX(55deg);
      animation: gridMove 22s linear infinite;
      mask-image: linear-gradient(transparent, black 40%, transparent);
      -webkit-mask-image: linear-gradient(transparent, black 40%, transparent);
    }

    .fx-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: var(--green);
      filter: blur(110px);
      opacity: .12;
      animation: glowFloat 12s ease-in-out infinite alternate;
    }

    .fx-glow-one {
      top: 5%;
      left: -180px;
    }

    .fx-glow-two {
      right: -200px;
      bottom: 5%;
      background: #718cff;
      animation-delay: -5s;
    }

    .fx-scanline {
      position: absolute;
      inset: 0;
      opacity: .13;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        #ffffff0a 4px
      );
    }

    #particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-particle {
      position: absolute;
      bottom: -12px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      opacity: 0;
      animation: ambientRise var(--duration, 12s) linear var(--delay, 0s) infinite;
    }

    /* =========================================
       NAVIGATION
    ========================================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 72px;
      padding: 14px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #ffffff16;
      background: #050505b8;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: navEnter .8s both;
    }

    .logo {
      font-size: 21px;
      font-weight: 950;
      letter-spacing: 3px;
      transition: letter-spacing .3s, text-shadow .3s;
    }

    .logo:hover {
      letter-spacing: 5px;
      text-shadow: 0 0 25px #ffffff70;
    }

    .logo span {
      color: var(--green);
    }

    /* =========================================
       PAGE LAYOUT
    ========================================= */

    .container {
      position: relative;
      width: min(100% - 32px, 460px);
      margin: 55px auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero-enhanced {
      animation: heroEnter .9s var(--ease) both;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 9px 13px;
      margin-bottom: 20px;
      border: 1px solid #ffffff20;
      border-radius: 100px;
      background: #ffffff06;
      color: #c9c9c9;
      font-size: 9px;
      letter-spacing: 2px;
      animation: badgeFloat 4s ease-in-out infinite;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: dotPulse 1.5s infinite;
    }

    .hero-art {
      position: relative;
      height: 190px;
      margin: 0 auto 25px;
      overflow: hidden;
      border: 1px solid #ffffff25;
      border-radius: 18px;
      background: #0b0b0b;
      box-shadow: 0 15px 55px #0008, 0 0 30px #8affaa08;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .76;
      filter: grayscale(100%) contrast(1.15);
      animation: imageReveal 1.4s both, imageDrift 18s ease-in-out infinite alternate;
      transition: filter .6s, opacity .6s;
    }

    .hero-art:hover .hero-image {
      filter: grayscale(20%) contrast(1.15);
      opacity: .98;
    }

    .hero-image-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, #050505 0%, transparent 60%),
        linear-gradient(90deg, #05050555, transparent, #05050555);
      pointer-events: none;
    }

    .hero-image-text {
      position: absolute;
      bottom: 13px;
      left: 15px;
      color: #ffffffa0;
      font-size: 9px;
      letter-spacing: 4px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 4px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 46px);
      margin: 13px 0;
      letter-spacing: -1px;
    }

    .hero-title {
      font-size: clamp(35px, 9vw, 52px);
      font-weight: 950;
      letter-spacing: -2px;
      animation: titleEnter 1s .15s both;
      overflow-wrap: anywhere;
    }

    .glitch {
      position: relative;
      display: inline-block;
      color: var(--green);
      text-shadow: 0 0 22px #8affaa40;
      animation: glitchPulse 5s infinite;
    }

    .hero-subtitle {
      animation: fadeUp .8s .35s both;
    }

    .hero-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      color: #6e776f;
      font-size: 8px;
      letter-spacing: 3px;
    }

    .hero-line span:first-child,
    .hero-line span:last-child {
      width: 25px;
      height: 1px;
      background: #8affaa80;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    /* =========================================
       GLASS PANEL (ต่อเติมจากที่ค้างไว้)
    ========================================= */

    .panel {
      position: relative;
      overflow: hidden;
      padding: 30px 25px;
      border: 1px solid #ffffff1c;
      border-radius: 20px;
      background: linear-gradient(145deg, #131313dc, #080808ef);
      box-shadow: 0 25px 80px #0007, inset 0 1px #ffffff08;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: panelEnter .8s .2s both;
      transition: border-color .35s, box-shadow .35s;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      animation: scanLight 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* =========================================
       INPUT & FORM CONTROLS
    ========================================= */

    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      gap: 10px;
    }

    .main-input {
      flex: 1;
      padding: 14px 16px;
      background: #ffffff04;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      transition: all .3s var(--ease);
    }

    .main-input:focus {
      background: #ffffff0a;
      border-color: var(--green);
      box-shadow: 0 0 15px #8affaa15;
    }

    .btn-add {
      padding: 0 20px;
      background: var(--green);
      color: #050505;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      transition: all .3s var(--ease);
    }

    .btn-add:hover {
      background: #a6ffbe;
      box-shadow: 0 0 20px #8affaa50;
      transform: translateY(-1px);
    }

    /* =========================================
       TASK ITEMS & INTERFACE
    ========================================= */

    .list-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #121212;
ใช้โค้ดอย่างระมัดระวัง
border: 1px solid var(--border);

}
.task-card:hover {
border-color: #444;
background: #161616;
}
.task-card.completed .task-text {
text-decoration: line-through;
color: var(--muted);
}
.task-content {

}
.checkbox {

height: 18px;

}

}

}

}
.btn-delete {

}
.empty-state {

padding: 30px 0;
color: var(--muted);
font-size: 13px;
border: 1px dashed var(--border);
border-radius: 12px;
}
/* =========================================
ANIMATIONS
========================================= */
@keyframes gridMove {
0% { background-position: 0 0; }
100% { background-position: 0 100%; }
}
@keyframes glowFloat {
0% { transform: translate(0, 0) scale(1); }
100% { transform: translate(30px, 20px) scale(1.15); }
}
@keyframes ambientRise {
0% { transform: translateY(0) scale(0.5); opacity: 0; }
10% { opacity: 0.6; }
90% { opacity: 0.4; }
100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
}
@keyframes scanLight {
0% { left: -120%; }
50%, 100% { left: 120%; }
}
@keyframes dotPulse {
0%, 100% { opacity: 0.3; transform: scale(0.9); }
50% { opacity: 1; transform: scale(1.1); }
}
@keyframes navEnter {
from { transform: translateY(-20px); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}
@keyframes heroEnter {
from { transform: translateY(30px); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}
@keyframes fadeUp {
from { transform: translateY(15px); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}
@keyframes panelEnter {
from { transform: translateY(40px) scale(0.98); opacity: 0; }
to { transform: translateY(0) scale(1); opacity: 1; }
}

// System Initialization & State Control
const taskInput = document.getElementById('taskInput');
const addBtn = document.getElementById('addBtn');
const taskList = document.getElementById('taskList');
let tasks = JSON.parse(localStorage.getItem('horizon_tasks')) || [];
// Background Particle Generator
function initParticles() {
const container = document.getElementById('particles');
const count = 25;
for (let i = 0; i < count; i++) {
const p = document.createElement('div');
p.className = 'ambient-particle';
p.style.left = ${Math.random() * 100}%;
p.style.setProperty('--duration', ${8 + Math.random() * 8}s);
p.style.setProperty('--delay', ${Math.random() * 10}s);
container.appendChild(p);
}
}
// Storage updates & re-rendering UI
function updateSystem() {
localStorage.setItem('horizon_tasks', JSON.stringify(tasks));
renderTasks();
}
function renderTasks() {
if (tasks.length === 0) {
taskList.innerHTML = <div class="empty-state">NO DATA STREAM DETECTED</div>;
return;
}
taskList.innerHTML = '';
tasks.forEach((task, index) => {
const card = document.createElement('div');
card.className = task-card ${task.completed ? 'completed' : ''};
card.innerHTML = <div class="task-content" onclick="toggleTask(${index})"> <div class="checkbox"></div> <span class="task-text">${escapeHTML(task.text)}</span> </div> <button class="btn-delete" onclick="deleteTask(${index})">DELETE</button>;
taskList.appendChild(card);
});
}
function addTask() {
const text = taskInput.value.trim();
if (!text) return;
tasks.push({ text, completed: false });
taskInput.value = '';
updateSystem();
}
window.toggleTask = function(index) {
tasks[index].completed = !tasks[index].completed;
updateSystem();
};
window.deleteTask = function(index) {
tasks[index].animateOut = true; // Placeholder for clean drop anims
tasks.splice(index, 1);
updateSystem();
};
function escapeHTML(str) {
return str.replace(/[&<>'"]/g,
tag => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[tag] || tag)
);
}
// Triggers
addBtn.addEventListener('click', addTask);
taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
// Bootstrap Core
initParticles();
renderTasks();
