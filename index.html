<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon X - Ultimate Cinematic UI</title>
    <style>
        /* 🖤 รากฐานและตัวแปรหลักสำหรับการปรับแต่ง */
        :root {
            --radius: 24px;
            --bounce-speed: 1.2s;
            --glow-white: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background-color: #020202; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
            perspective: 1000px;
        }

        /* 🎆 มหากาพย์ชุดแอนิเมชันระดับ Cinematic */
        @keyframes cinematicPop {
            0% { transform: scale(0.3) translateY(50px) rotateX(-30deg); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.04) translateY(-10px) rotateX(10deg); opacity: 0.8; filter: blur(0px); }
            70% { transform: scale(0.98) translateY(2px) rotateX(-5deg); opacity: 0.9; }
            100% { transform: scale(1) translateY(0) rotateX(0deg); opacity: 1; }
        }
        @keyframes floatEffect {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); border-color: rgba(255,255,255,0.2); }
            50% { box-shadow: 0 0 35px rgba(255, 255, 255, 0.2); border-color: rgba(255,255,255,0.6); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15%, 45%, 75% { transform: translateX(-8px) rotate(-1deg); }
            30%, 60%, 90% { transform: translateX(8px) rotate(1deg); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 📺 เอฟเฟกต์พื้นหลังมิติ Cyberpunk ขาวดำ */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%; z-index: 999; pointer-events: none;
        }

        .page { 
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
            width: 90%; max-width: 420px; padding: 30px; background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .active { 
            display: flex; 
            animation: cinematicPop var(--bounce-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) both; 
        }

        /* 🏷️ การตกแต่งฟอนต์และหัวข้อ */
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 3px; margin-bottom: 8px; text-transform: uppercase; background: linear-gradient(180deg, #ffffff 0%, #aaaaaa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 0.9rem; color: #888888; margin-bottom: 35px; letter-spacing: 0.5px; }
        
        /* ⚪ ปุ่มสุดเด้งแบบลื่นไหลและตอบสนองแรงสัมผัส */
        .btn { 
            background-color: #ffffff; color: #000000; border: none; padding: 16px 32px; font-weight: 800; 
            border-radius: var(--radius); cursor: pointer; width: 100%; font-size: 1rem; margin-top: 15px; 
            letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 8px 20px rgba(255,255,255,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 25px rgba(255,255,255,0.2); }
        .btn:active { transform: translateY(2px) scale(0.95); }
        
        .btn-secondary { background-color: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.4); box-shadow: none; }
        .btn-secondary:hover { background-color: #ffffff; color: #000000; }
        
        /* ⌨️ ช่องกรอกข้อมูลโค้งมนพร้อมอนิเมชันเรืองแสง */
        .input-group { width: 100%; margin-bottom: 15px; }
        input { 
            width: 100%; padding: 15px 22px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); 
            color: #ffffff; border-radius: var(--radius); font-size: 1rem; letter-spacing: 0.5px;
            transition: all 0.3s ease; 
        }
        input:focus { outline: none; border-color: #ffffff; box-shadow: 0 0 15px rgba(255,255,255,0.1); background: rgba(15, 15, 15, 0.9); }
        
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        .link-text { color: #888888; text-decoration: none; cursor: pointer; margin-top: 25px; font-size: 0.85rem; transition: color 0.2s; letter-spacing: 1px; }
        .link-text:hover { color: #ffffff; text-decoration: underline; }
        
        /* 💳 บล็อก Wallet ทรงพลังลอยตัวได้ */
        .wallet-card { 
            border: 1px solid rgba(255,255,255,0.1); padding: 25px; width: 100%; 
            border-radius: var(--radius); margin-bottom: 25px; background: rgba(20, 20, 20, 0.4);
            animation: floatEffect 4s ease-in-out infinite, pulseGlow 3s ease-in-out infinite;
        }

        /* 🎛️ แผงควบคุมสดหลังบ้าน (Tweaker Box) สำหรับคุณ */
        .tweaker-panel {
            margin-top: 25px; padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.1); width: 100%; text-align: left;
        }
        .tweaker-panel label { font-size: 0.75rem; color: #666; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .tweaker-panel input[type="range"] { margin-bottom: 10px; width: 100%; accent-color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. หน้ายินดีต้อนรับ (Welcome Page) -->
    <div id="welcomePage" class="page active">
        <div style="font-size: 4rem; margin-bottom: 10px; animation: floatEffect 5s ease-in-out infinite;">🪐</div>
        <h1>Horizon X</h1>
        <p>ยินดีต้อนรับสู่ขอบฟ้าใหม่ของการซื้อขายไอเทม</p>
        <button class="btn" onclick="switchPage('authPage')">เริ่มต้นใช้งาน</button>
    </div>

    <!-- 2. หน้าล็อกอินและสมัครสมาชิก -->
    <div id="authPage" class="page">
        <h1 id="authTitle">เข้าสู่ระบบ</h1>
        <p id="authSub">กรุณากรอกข้อมูลสิทธิ์การเข้าถึงคอมมูนิตี้</p>
        
        <div class="input-group"><input type="email" id="email" placeholder="อีเมลของคุณ"></div>
        <div class="input-group"><input type="password" id="password" placeholder="รหัสผ่านผ่านประตู"></div>

        <button class="btn" id="mainAuthBtn" onclick="handleAuth()">ยืนยันตัวตน</button>
        <button class="btn btn-secondary" id="switchBtn" onclick="toggleAuthMode()">สมัครบัญชีใหม่</button>
        <p class="link-text" onclick="switchPage('welcomePage')">← ย้อนกลับหน้าแรก</p>
    </div>

    <!-- 3. หน้าแดชบอร์ดหลักเมื่อล็อกอินสำเร็จแล้ว + กล่องปรับแต่งตามใจชอบ -->
    <div id="dashboardPage" class="page">
        <h1 style="font-size: 1.6rem;">MAIN INTERFACE</h1>
        <p>ยินดีต้อนรับกลับเข้าสู่ศูนย์บัญชาการ Horizon X</p>
        
        <div class="wallet-card">
            <span style="color:#666; font-size:0.75rem; letter-spacing: 2px; font-weight: bold; display:block;">CURRENT BALANCE</span>
            <h2 id="userWallet" style="margin-top:8px; font-size: 2.2rem; font-weight: 900; letter-spacing: 1px;">0.00 THB</h2>
        </div>

        <!-- 🎛️ กล่องลูกเล่นปรับความโค้งและความเด้งได้สดๆ บนหน้าจอมือถือคุณ -->
        <div class="tweaker-panel">
            <h3 style="font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px; color:#aaa;">🎛️ HORIZON CUSTOMIZER</h3>
            
            <label id="radiusLabel">ความโค้งมน: 24px</label>
            <input type="range" min="0" max="40" value="24" oninput="updateRadius(this.value)">
            
            <label id="speedLabel">ความเร็วความเด้ง: 1.2s</label>
            <input type="range" min="3" max="25" value="12" oninput="updateSpeed(this.value)">
        </div>

        <button class="btn btn-secondary" style="margin-top: 20px;" onclick="logout()">ตัดการเชื่อมต่อระบบ</button>
    </div>

    <script>
        let isSignUpMode = false;

        /* ฟังก์ชันควบคุมแถบเลื่อนปรับแต่ง UI ได้ตามใจชอบ */
        function updateRadius(val) {
            document.documentElement.style.setProperty('--radius', val + 'px');
